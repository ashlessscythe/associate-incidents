version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Group minors/patches AND majors so Dependabot opens fewer PRs.
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    ignore:
      # Major upgrades that need coordinated app/schema migrations or break CI.
      - dependency-name: prisma
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Express 5 changes path-to-regexp wildcards (breaks `app.get('*', ...)`).
      - dependency-name: express
        update-types: ["version-update:semver-major"]
      # Tailwind 4 / TypeScript 7 need dedicated migration PRs.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@testing-library/jest-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]
      - dependency-name: globals
        update-types: ["version-update:semver-major"]
      # Production majors that need API/compat review before landing.
      - dependency-name: "@faker-js/faker"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-pdf/renderer"
        update-types: ["version-update:semver-major"]
      # 0.x minors rename icons (AlertCircle → CircleAlert, etc.) and break imports.
      - dependency-name: lucide-react
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: react-datepicker
        update-types: ["version-update:semver-major"]
      - dependency-name: resend
        update-types: ["version-update:semver-major"]
      # Vitest 5 is a dedicated migration; keep coverage on the same major.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
