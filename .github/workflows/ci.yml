name: CI

on:
  push:
    branches: [dev, public]
  pull_request:
    branches: [dev, public]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          # prisma generate does not need a live DB; tsc/vite need a clean install
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci
